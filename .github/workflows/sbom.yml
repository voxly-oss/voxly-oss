name: "SBOM Generation (Syft)"

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "backend/requirements.txt"
      - "frontend/package-lock.json"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate SBOM for backend
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./backend
          format: spdx-json
          output-file: sbom-backend.spdx.json
          artifact-name: sbom-backend.spdx.json

      - name: Generate SBOM for frontend
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./frontend
          format: spdx-json
          output-file: sbom-frontend.spdx.json
          artifact-name: sbom-frontend.spdx.json

      - name: Attach SBOMs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            sbom-backend.spdx.json
            sbom-frontend.spdx.json
