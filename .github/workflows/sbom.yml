name: "SBOM Generation (Syft)"

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "backend/requirements.txt"
      - "frontend/package-lock.json"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate SBOM for backend
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./backend
          format: spdx-json
          output-file: sbom-backend.spdx.json
          artifact-name: sbom-backend.spdx.json

      - name: Generate SBOM for frontend
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./frontend
          format: spdx-json
          output-file: sbom-frontend.spdx.json
          artifact-name: sbom-frontend.spdx.json

      - name: Attach SBOMs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            sbom-backend.spdx.json
            sbom-frontend.spdx.json
