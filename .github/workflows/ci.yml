name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Least-privilege GITHUB_TOKEN ──────────────────────────────
permissions:
  contents: read
  pull-requests: read

# ── Cancel duplicate runs on the same branch ──────────────────
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend: Lint + Test + Security ───────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: voxly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Safety check — known CVEs in Python packages
        run: |
          pip install safety
          safety check --full-report -r requirements.txt || true
        # "|| true" — report only, don't block CI (Snyk handles blocking)

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/voxly_test
          SECRET_KEY: test-secret-key-not-real
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          ANTHROPIC_API_KEY: sk-test
          GITHUB_CLIENT_ID: gh-test
          GITHUB_CLIENT_SECRET: gh-test-secret
          TWILIO_ACCOUNT_SID: ACtest
          TWILIO_AUTH_TOKEN: test
          TWILIO_WHATSAPP_NUMBER: "whatsapp:+10000000000"
          REDIS_URL: redis://localhost:6379
          DEBUG: "true"
        run: |
          alembic upgrade head
          pytest -v --cov=app --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

      - name: Snyk Security Scan — Python
        uses: snyk/actions/python@9adf32b1121593767fc3c057af55b55db032dc04 # master@2025-10-03
        continue-on-error: true  # Non-blocking: SNYK_TOKEN may not be set yet
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=requirements.txt --severity-threshold=high

      - name: Deploy to Railway
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true  # Non-blocking: RAILWAY_TOKEN may not be set
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli
          railway up --service backend --detach

  # ─── Frontend: Lint + Build + Security ─────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit — check for HIGH/CRITICAL CVEs
        run: npm audit --audit-level=high --omit=dev || true
        # Report only — dependency-review.yml blocks PRs with new HIGH CVEs

      - name: Lint
        run: npm run lint
        continue-on-error: true  # eslint-config-next@16 has circular JSON bug with ESLint 9

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: test-google-client-id
        run: npm run build

      - name: Snyk Security Scan — npm
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # master@2025-10-03
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ─── Docker: Build Test ──────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          push: false
          tags: voxly-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          push: false
          tags: voxly-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=ci-placeholder
