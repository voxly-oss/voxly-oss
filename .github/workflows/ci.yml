name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Least-privilege GITHUB_TOKEN ──────────────────────────────
permissions:
  contents: read
  checks: write
  pull-requests: read

# ── Cancel duplicate runs on the same branch ──────────────────
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend: Lint + Test + Security ───────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: voxly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Safety check — known CVEs in Python packages
        run: |
          pip install safety
          safety check --full-report -r requirements.txt || true
        # "|| true" — report only, don't block CI (Snyk handles blocking)

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/voxly_test
          SECRET_KEY: test-secret-key-not-real
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          ANTHROPIC_API_KEY: sk-test
          GITHUB_CLIENT_ID: gh-test
          GITHUB_CLIENT_SECRET: gh-test-secret
          TWILIO_ACCOUNT_SID: ACtest
          TWILIO_AUTH_TOKEN: test
          TWILIO_WHATSAPP_NUMBER: "whatsapp:+10000000000"
          REDIS_URL: redis://localhost:6379
          DEBUG: "true"
        run: |
          alembic upgrade head
          pytest -v --cov=app --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

      - name: Snyk Security Scan — Python
        uses: snyk/actions/python@master
        continue-on-error: true  # Non-blocking: SNYK_TOKEN may not be set yet
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=requirements.txt --severity-threshold=high

      - name: Deploy to Railway
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true  # Non-blocking: RAILWAY_TOKEN may not be set
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli
          railway up --service backend --detach

  # ─── Frontend: Lint + Build + Security ─────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit — check for HIGH/CRITICAL CVEs
        run: npm audit --audit-level=high --omit=dev || true
        # Report only — dependency-review.yml blocks PRs with new HIGH CVEs

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: test-google-client-id
        run: npm run build

      - name: Snyk Security Scan — npm
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ─── Docker: Build Test ──────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend
          push: false
          tags: voxly-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./frontend
          push: false
          tags: voxly-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
